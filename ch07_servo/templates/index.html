
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servo Motor Control</title>

</head>
<body>
    <div class="container-fluid">
        <h1>Servo Motor Control</h1>

        <div>
            <span>
                Enter Angle (0-180):
            </span>

            <input
                type="number"
                id="angle"
                min="0"
                max="180"
            >

            <button
                type="button"
                id="setAngle"
            >
                Set Angle
            </button>
        </div>
    </div>

<script src="{{ url_for('static', filename='index.js') }}"></script>

</body>
</html>
